<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="401" viewBox="0 0 1100 401" role="img"><title>RISE public post feedback</title><rect width="1100" height="401" rx="24" fill="#f5f1e9"/><g font-family="Arial, sans-serif"><text x="38" y="70" font-size="27" fill="#191b1b" >Visibility is evidence to inspect, not a proof of lift.</text><text x="300" y="133" font-size="15" fill="#454a48" >Views</text><text x="446" y="133" font-size="15" fill="#454a48" >Replies</text><text x="592" y="133" font-size="15" fill="#454a48" >Likes</text><text x="738" y="133" font-size="15" fill="#454a48" >Reposts</text><text x="884" y="133" font-size="15" fill="#454a48" >Bookmarks</text><text x="38" y="185" font-size="16" fill="#191b1b" >Prompt experiment</text><text x="300" y="185" font-size="24" fill="#b73825" >117</text><text x="446" y="185" font-size="24" fill="#b73825" >1</text><text x="592" y="185" font-size="24" fill="#b73825" >2</text><text x="738" y="185" font-size="24" fill="#b73825" >0</text><text x="884" y="185" font-size="24" fill="#b73825" >0</text><text x="38" y="209" font-size="11" fill="#636660" >2026-10-07T21:03:15.192Z</text><text x="38" y="253" font-size="16" fill="#191b1b" >Launch post</text><text x="300" y="253" font-size="24" fill="#b73825" >161</text><text x="446" y="253" font-size="24" fill="#b73825" >2</text><text x="592" y="253" font-size="24" fill="#b73825" >1</text><text x="738" y="253" font-size="24" fill="#b73825" >1</text><text x="884" y="253" font-size="24" fill="#b73825" >N/A</text><text x="38" y="277" font-size="11" fill="#636660" >2026-10-07T21:44:37.232Z</text><text x="38" y="341" font-size="14" fill="#8b5520" >Public counters can include the account owner; independent endorsements are unknown.</text><text x="38" y="369" font-size="14" fill="#454a48" >Each row retains its own X observation time; GitHub refreshes do not update it.</text></g></svg>
