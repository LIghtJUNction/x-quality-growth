    <text x="55" y="450" font-size="22" font-weight="500" fill="#454a48">有价值的内容，带来下一轮真实反馈。</text>
  </g>
  <text class="latin" x="56" y="382" font-size="20" fill="#636660">Recursive Iterative Social Expansion</text>
