<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">RISE — 递归自我涨粉</title>
  <desc id="desc">Recursive Iterative Social Expansion. An animated feedback circuit connects X publishing, GitHub collaboration, real measurements and iteration. This illustrates the process, not predicted growth.</desc>
