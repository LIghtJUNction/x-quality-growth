    .cjk{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}
    .latin{font-family:'Noto Sans','Helvetica Neue',sans-serif}
    .flow{animation:circulate 14s linear infinite}
    @keyframes circulate{to{stroke-dashoffset:-1114.655}}
    @media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
