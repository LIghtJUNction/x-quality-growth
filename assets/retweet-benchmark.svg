<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
<title id="title">SEISMIC 转发预测：总体 MAE 略降，两个局部指标仍输基线</title>
<desc id="desc">Historical 2011 selected-success SEISMIC retweet benchmark. At each cutoff, 59565 chronological training cascades, 12193 purged, 94171 later evaluation cascades. Five-feature MLP with 241 parameters per cutoff, single CPU thread. Shared zero-to-70 axis compares bucket median and MLP raw additional-retweet MAE:15m63.18489768612418 versus60.398814752957605;60m47.078384003567976 versus45.71171389295395. Descriptive reductions4.409412747657923% and2.9029673374312224%. The15m cold subset of881 has worse MLP MAE61.98824833362246 versus61.72304199772985. The60m test P90 absolute error is also worse105.18340873718262 versus105.0. These are retrospective selected-corpus results, not current views, verified Home, origin labels, stable superiority or causal follower growth. Full five-model aggregate metrics are in public/retweet-benchmark.json.</desc>
