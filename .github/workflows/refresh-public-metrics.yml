name: Refresh public metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: rise-public-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/update_github_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/render_public.py
      - run: python3 -m unittest discover -s tests -v
      - name: Publish refreshed observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/metrics.json assets/metrics.svg assets/feedback.svg README.md README.en.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh public GitHub observations'
            git push
          fi
